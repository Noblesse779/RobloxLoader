<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดแอดมิน | เที่ยวรอบโลก</title>
<link rel="stylesheet" href="admin.css">
</head>
<body class="dashboard-page">
  <header class="dash-header">
    <span class="logo">🌏 แดชบอร์ดแอดมิน</span>
    <div class="dash-header-right">
      <span id="whoami"></span>
      <a href="/" class="ghost-btn">ดูเว็บไซต์</a>
      <button id="logoutBtn" class="ghost-btn">ออกจากระบบ</button>
    </div>
  </header>

  <main class="dash-main">
    <div class="dash-toolbar">
      <h2>สถานที่ท่องเที่ยว (<span id="destCount">0</span>)</h2>
      <button id="addBtn" class="primary-btn">+ เพิ่มสถานที่ใหม่</button>
    </div>

    <p class="message" id="listMessage"></p>

    <div class="table-wrap">
      <table id="destTable">
        <thead>
          <tr>
            <th>สถานที่</th>
            <th>ประเทศ</th>
            <th>ทวีป</th>
            <th>คะแนน</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="destTableBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="formOverlay" hidden>
    <div class="modal-box">
      <button class="modal-x" id="formClose">&times;</button>
      <h3 id="formTitle">เพิ่มสถานที่ใหม่</h3>
      <form id="destForm">
        <input type="hidden" id="destId">
        <div class="form-row">
          <div>
            <label for="name">ชื่อสถานที่</label>
            <input type="text" id="name" required maxlength="100">
          </div>
          <div>
            <label for="flag">ธงประเทศ (อิโมจิ)</label>
            <input type="text" id="flag" maxlength="8" placeholder="🇹🇭">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="country">ประเทศ</label>
            <input type="text" id="country" required maxlength="100">
          </div>
          <div>
            <label for="continent">ทวีป</label>
            <select id="continent" required>
              <option value="asia">เอเชีย</option>
              <option value="europe">ยุโรป</option>
              <option value="america">อเมริกา</option>
              <option value="africa">แอฟริกา</option>
              <option value="oceania">โอเชียเนีย</option>
            </select>
          </div>
        </div>
        <label for="description">คำอธิบาย</label>
        <textarea id="description" required maxlength="1000" rows="3"></textarea>

        <label for="image_url">URL รูปภาพ</label>
        <input type="url" id="image_url" required maxlength="2000" placeholder="https://...">

        <div class="form-row">
          <div>
            <label for="rating">คะแนน (0-5)</label>
            <input type="number" id="rating" min="0" max="5" step="0.1" required>
          </div>
          <div>
            <label for="best_time">ช่วงเวลาที่ดีที่สุด</label>
            <input type="text" id="best_time" maxlength="100" placeholder="เช่น มี.ค. - พ.ค.">
          </div>
        </div>
        <label for="currency">สกุลเงิน</label>
        <input type="text" id="currency" maxlength="100" placeholder="เช่น บาท (THB)">

        <p class="message" id="formMessage"></p>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="ghost-btn">ยกเลิก</button>
          <button type="submit" class="primary-btn">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
